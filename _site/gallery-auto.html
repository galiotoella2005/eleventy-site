<!doctype html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" 
           content="width=device-width, 
           user-scalable=no, 
           initial-scale=1.0, 
           maximum-scale=1.0, 
           minimum-scale=1.0">
     <meta http-equiv="X-UA-Compatible" 
           content="ie=edge">
     <title>Base Nunjucks</title>
     <link rel="stylesheet" href="CSS/style.css">
     <script type="module" src="js/is-land.js"></script>

      
</head>
<body>
<header class="site-header">
<nav class="site-header">
    <a href="index.html">Home</a>
    <a href="guide.html">Nav1</a>
    <a href="index.html">Nav2</a>
    <a href="index.html">Nav3</a>
</nav>
</header>
<h1>Gallery (automatic) </h1>
<p></p>
<p>Please press a button to choose a topical set of images.</p>


<is-land on:visible>
  <div id="gallery" v-scope="{ active: 'all' }">
    <div class="filters">
      <button @click="active = 'all'" :class="{ on: active === 'all' }" :aria-pressed="active === 'all'">All</button>
      
      <button @click="active = 'photos'" :class="{ on: active === 'photos' }" :aria-pressed="active === 'photos'">photos</button>
      
      <button @click="active = 'sketches'" :class="{ on: active === 'sketches' }" :aria-pressed="active === 'sketches'">sketches</button>
      
      <button @click="active = 'type'" :class="{ on: active === 'type' }" :aria-pressed="active === 'type'">type</button>
      
    </div>
    <p aria-live="polite">Showing: <span v-text="active"></span></p>
    
    <section class="topic" v-show="active === 'all' || active === 'photos'">
      <h3>photos</h3>
      <div class="row">
        
        <figure>
          <img src="images/photos/vrheadset_girl.jpg" alt="photo of a girl wearing a vr headset">
          <figcaption>vrheadset girl</figcaption>
        </figure>
        
        <figure>
          <img src="images/photos/vrheadset_pink.jpeg" alt="image of the inside of a vr headset">
          <figcaption>vrheadset pink</figcaption>
        </figure>
        
        <figure>
          <img src="images/photos/vr-smartwatch.jpeg" alt="a photo of a wrist with a watch recieving a call and in the background theres a group of people gathered around someone wearing a vr headset">
          <figcaption>vr-smartwatch</figcaption>
        </figure>
        
      </div>
    </section>
    
    <section class="topic" v-show="active === 'all' || active === 'sketches'">
      <h3>sketches</h3>
      <div class="row">
        
        <figure>
          <img src="images/sketches/sketchofvr.jpeg" alt="sketch of a white vr headset">
          <figcaption>sketchofvr</figcaption>
        </figure>
        
        <figure>
          <img src="images/sketches/sketchvrman.jpeg" alt="black lined sketch of a man wearing a vr headset">
          <figcaption>sketchvrman</figcaption>
        </figure>
        
      </div>
    </section>
    
    <section class="topic" v-show="active === 'all' || active === 'type'">
      <h3>type</h3>
      <div class="row">
        
        <figure>
          <img src="images/type/smartwatch.jpeg" alt="4 hands with watches on each wrist">
          <figcaption>smartwatch</figcaption>
        </figure>
        
        <figure>
          <img src="images/type/smartwatch2.jpeg" alt="photo of a Garmin watch with a colorful background">
          <figcaption>smartwatch2</figcaption>
        </figure>
        
      </div>
    </section>
    
  </div>

  <template data-island>
    <script type="module">
      import { createApp } from './js/petite-vue.js'
      createApp().mount('#gallery')
    </script>
  </template>
</is-land>
</body>


</html>
